name: Deploy to NuGet

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore fhir.distillery.sln

      - name: Build
        run: dotnet build fhir.distillery.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test fhir.distillery.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack fhir.distillery/fhir.distillery.csproj --configuration Release --no-build --output ${{ github.workspace }}/nupkg

      - name: Push to NuGet
        run: dotnet nuget push "${{ github.workspace }}/nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
