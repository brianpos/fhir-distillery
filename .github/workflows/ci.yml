name: CI Build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore fhir.distillery.sln

      - name: Build
        run: dotnet build fhir.distillery.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test fhir.distillery.sln --configuration Release --no-build --verbosity normal
